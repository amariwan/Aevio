name: Aevio
options:
  bundleIdPrefix: com.offlinestudios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  Aevio:
    type: application
    platform: iOS
    sources:
      - path: Aevio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.offlinestudios.aevio.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Aevio connects to your Mac over the local network to show and control your timers.
        INFOPLIST_KEY_CFBundleDisplayName: Aevio
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
