[package]
name = "aevio-cli"
version = "0.9.39"
edition = "2021"
license = "AGPL-3.0-only"
description = "aevio, Aevio from the terminal"

[[bin]]
name = "aevio"
path = "src/main.rs"

[dependencies]
aevio-core = { path = "../../crates/aevio-core" }
aevio-contracts = { path = "../../crates/aevio-contracts" }
aevio-infrastructure = { path = "../../crates/aevio-infrastructure" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
zip = "4.6.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Same versions the app uses, for `install-path` writing the user PATH.
windows-registry = "0.6"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
aevio-persistence = { path = "../../crates/aevio-persistence" }
rusqlite = { version = "0.38.0", features = ["bundled"] }
