[package]
name = "aevio-server"
version = "0.9.40"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
aevio-contracts = { path = "../../crates/aevio-contracts" }
aevio-http = { path = "../../crates/aevio-http" }
aevio-infrastructure = { path = "../../crates/aevio-infrastructure" }
aevio-services = { path = "../../crates/aevio-services" }
aevio-persistence = { path = "../../crates/aevio-persistence" }
aevio-persistence-postgres = { path = "../../crates/aevio-persistence/postgres-adapter" }
aevio-core = { path = "../../crates/aevio-core" }
axum = "0.8"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
http-body-util = "0.1"
sea-orm = { version = "2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "postgres-array", "with-chrono", "with-json", "with-uuid"] }
tower = { version = "0.5", features = ["util"] }
