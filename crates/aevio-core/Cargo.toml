[package]
name = "aevio-core"
version = "0.9.39"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
aevio-contracts = { path = "../../crates/aevio-contracts" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
chrono-tz = "0.10"

